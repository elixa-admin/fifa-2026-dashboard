name: Pull FIFA results

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npm exec --yes --package=playwright@1.55.0 -- playwright install --with-deps chromium

      - name: Sync official results
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/pull-fifa-results.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- lib/data/fifaLiveResults.ts; then
            echo "No fixture updates found."
            exit 0
          fi
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add lib/data/fifaLiveResults.ts
          git commit -m "chore: sync fifa live results"
          git push
